<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SEFS Course Delivery</title>
<style>
:root{--bg:#f5f6f3;--surface:#fff;--ink:#16201a;--ink-2:#4d5851;--rule:#e2e6e0;--accent:#2d6a4c;--warn:#7a4b00;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111412;--surface:#1a1e1b;--ink:#eef1ec;--ink-2:#b6beb8;--rule:#2b312d;--accent:#7cc19d;--warn:#f2c46b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:24px;display:grid;gap:12px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--ink-2);font-size:14px}
label{font-size:13px;color:var(--ink-2)}
input[type=password]{font:15px system-ui,sans-serif;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.rm{display:flex;gap:8px;align-items:center}
button{font:600 14px system-ui,sans-serif;padding:10px;border:0;border-radius:6px;background:var(--ink);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--warn);min-height:1.2em}
</style>
</head>
<body>
<form id="f">
  <h1>SEFS Course Delivery</h1>
  <p>This dashboard is password protected. Enter the password to open it.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label class="rm"><input type="checkbox" id="rm"> Remember on this device</label>
  <button id="go" type="submit">Open dashboard</button>
  <p id="err" role="alert"></p>
</form>

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var KEYNAME='dash-key-'+P.s.slice(0,12);
  function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  function tob64(b){var s='';b=new Uint8Array(b);for(var i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)}
  async function derive(pw){
    var m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.it,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt']);
  }
  async function decrypt(k){
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},k,b64(P.ct));
    if(P.z){pt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}
    return new TextDecoder().decode(pt);
  }
  function show(html){document.open();document.write(html);document.close()}
  async function unlock(k){show(await decrypt(k))}
  if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='This browser cannot decrypt the page. Open it over https in a current browser.';return}
  try{var saved=localStorage.getItem(KEYNAME);
    if(saved){crypto.subtle.importKey('raw',b64(saved),'AES-GCM',true,['decrypt']).then(unlock).catch(function(){try{localStorage.removeItem(KEYNAME)}catch(e){}})}}catch(e){}
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();var btn=document.getElementById('go'),err=document.getElementById('err');
    btn.disabled=true;err.textContent='Checking…';
    try{var k=await derive(document.getElementById('pw').value);
      var html=await decrypt(k);
      if(document.getElementById('rm').checked){try{localStorage.setItem(KEYNAME,tob64(await crypto.subtle.exportKey('raw',k)))}catch(x){}}
      show(html);
    }catch(x){btn.disabled=false;err.textContent='That password did not work. Try again.';}
  });
})();
</script>
